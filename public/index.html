<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>NOWACTION — Motion Website Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/motion-editor.css" />
  <script src="/vendor/jszip/jszip.min.js"></script>
</head>
<body>
  <div id="app" class="na-app" aria-busy="true">
    <header id="top-app-bar" class="na-topbar">
      <button id="project-button" class="na-icon-btn" aria-label="Projects and document settings" title="Projects and document settings"></button>
      <button id="project-title" class="na-project-title" aria-label="Rename project">Loading…</button>
      <div id="top-status" class="na-top-status" aria-live="polite"></div>
      <div id="normal-top-actions" class="na-top-actions">
        <button id="preview-button" class="na-icon-btn" aria-label="Preview" title="Preview"></button>
        <button id="export-button" class="na-icon-btn na-primary" aria-label="Export" title="Export"></button>
      </div>
      <div id="selection-top-actions" class="na-top-actions na-hidden">
        <button id="group-button" class="na-icon-btn" aria-label="Group selected layers" title="Group"></button>
        <button id="duplicate-button" class="na-icon-btn" aria-label="Duplicate selected layers" title="Duplicate"></button>
        <button id="delete-button" class="na-icon-btn na-danger" aria-label="Delete selected layers" title="Delete"></button>
      </div>
    </header>

    <main class="na-main">
      <section id="preview-stage" class="na-preview-stage" aria-label="Website preview">
        <div id="preview-frame" class="na-preview-frame">
          <div id="website-scroll-root" class="na-website-scroll-root">
            <div id="website-document" class="na-website-document">
              <div id="project-background" class="na-project-background"></div>
              <div id="scene-root" class="na-scene-root"></div>
            </div>
          </div>
          <div id="preview-badge" class="na-preview-badge">390 × 844</div>
        </div>
      </section>

      <section id="bottom-workspace" class="na-bottom-workspace">
        <div id="transport-row" class="na-transport-row">
          <button id="previous-marker-button" class="na-icon-btn" aria-label="Previous marker" title="Previous marker"></button>
          <button id="play-button" class="na-icon-btn na-play" aria-label="Play" title="Play"></button>
          <button id="next-marker-button" class="na-icon-btn" aria-label="Next marker" title="Next marker"></button>
          <button id="progress-button" class="na-progress-value" aria-label="Current scroll progress">0%</button>
        </div>
        <div id="context-root" class="na-context-root"></div>
      </section>
    </main>

    <input id="image-file-input" type="file" accept="image/*" hidden />
  </div>

  <div id="toast" class="na-toast" role="status" aria-live="polite"></div>

  <dialog id="project-dialog" class="na-dialog">
    <form method="dialog" class="na-dialog-card">
      <header class="na-dialog-header">
        <h2>Project & Document</h2>
        <button class="na-icon-btn" value="cancel" aria-label="Close" data-icon="close"></button>
      </header>
      <div class="na-dialog-body">
        <div class="na-settings-section">
          <label>Project</label>
          <div class="na-project-picker-row">
            <select id="project-select"></select>
            <button id="new-project-button" type="button" class="na-icon-btn" aria-label="New project" title="New project"></button>
          </div>
        </div>
        <div class="na-settings-section">
          <label for="project-name-input">Name</label>
          <input id="project-name-input" type="text" maxlength="80" />
        </div>
        <div class="na-settings-grid">
          <div class="na-settings-section">
            <label for="background-color-input">Background</label>
            <input id="background-color-input" type="color" />
          </div>
          <div class="na-settings-section">
            <label for="height-mode-select">Height</label>
            <select id="height-mode-select">
              <option value="auto">Auto</option>
              <option value="custom">Custom</option>
            </select>
          </div>
        </div>
        <div id="custom-height-row" class="na-settings-section na-hidden">
          <label for="custom-height-input">Custom height (px)</label>
          <input id="custom-height-input" type="number" min="844" step="1" />
        </div>
        <div class="na-settings-section">
          <label for="bottom-padding-input">Bottom padding (px)</label>
          <input id="bottom-padding-input" type="number" min="0" step="1" />
        </div>
        <p class="na-dialog-note">The built-in background automatically covers the whole website. A custom-sized background should be created as a normal shape layer.</p>
      </div>
      <footer class="na-dialog-footer">
        <a href="/legacy.html" class="na-secondary-link" title="Open the legacy editor and AI Copilot">Legacy / AI</a>
        <button id="save-project-settings-button" type="button" class="na-button na-primary-button">Save</button>
      </footer>
    </form>
  </dialog>

  <dialog id="export-dialog" class="na-dialog na-code-dialog">
    <form method="dialog" class="na-dialog-card na-code-card">
      <header class="na-dialog-header">
        <h2>Export</h2>
        <button class="na-icon-btn" value="cancel" aria-label="Close" data-icon="close"></button>
      </header>
      <div id="export-performance" class="na-performance-report" aria-live="polite"></div>
      <textarea id="export-code" class="na-code-area" readonly spellcheck="false"></textarea>
      <footer class="na-dialog-footer na-export-actions">
        <button id="copy-export-button" type="button" class="na-icon-btn" aria-label="Copy export code" title="Copy"></button>
        <button id="download-html-button" type="button" class="na-icon-btn" aria-label="Download HTML" title="Download HTML"></button>
        <button id="download-zip-button" type="button" class="na-icon-btn na-primary" aria-label="Download ZIP" title="Download ZIP"></button>
      </footer>
    </form>
  </dialog>

  <dialog id="confirm-dialog" class="na-dialog">
    <form method="dialog" class="na-dialog-card na-confirm-card">
      <header class="na-dialog-header"><h2 id="confirm-title">Confirm</h2></header>
      <div id="confirm-message" class="na-dialog-body"></div>
      <footer class="na-dialog-footer">
        <button value="cancel" class="na-button">Cancel</button>
        <button id="confirm-ok-button" value="default" class="na-button na-primary-button">Continue</button>
      </footer>
    </form>
  </dialog>

  <script src="/js/motion-app.js"></script>
</body>
</html>
